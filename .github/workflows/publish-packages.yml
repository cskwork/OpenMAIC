name: Publish @openmaic packages

# Publishes the @openmaic/* package family (dsl, storage, renderer, importer) to npm.
#
# Scope is pinned to those four packages by name on purpose: the workspace also
# contains vendored forks (mathml2omml, pptxgenjs) whose names we do NOT own, so
# a recursive publish must never touch them.
#
# Triggers:
#   - merge a change to one of the @openmaic/* package manifests on `main`
#     (real publish). This is the normal path for version-bump releases.
#   - push a tag like `@openmaic/dsl@0.1.0` (real publish). NOTE: any @openmaic/*
#     tag runs `pnpm -r publish` over all four packages — pnpm skips versions
#     already on the registry, so in steady state this is idempotent. The tag is a
#     release marker, not a per-package gate: an unpublished version bump for a
#     sibling package sitting in the repo will also be published by any tag. Bump
#     only the package(s) you intend to release in the same change.
#   - manual run via the Actions tab (dry-run by default; uncheck to publish)
#
# Prerequisites (one-time, see issue #778):
#   - npm org `openmaic` created and owning the `@openmaic` scope
#   - repo secret NPM_TOKEN: an automation/granular token with publish rights
#     to @openmaic/*, 2FA set to "auth only" (not "auth and writes") so CI can publish

on:
  push:
    branches: [main]
    tags:
      - "@openmaic/*@*"
    paths:
      - "packages/@openmaic/dsl/package.json"
      - "packages/@openmaic/storage/package.json"
      - "packages/@openmaic/renderer/package.json"
      - "packages/@openmaic/importer/package.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate only, do not publish"
        type: boolean
        default: true

concurrency:
  group: publish-openmaic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to write the release tags below
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate compares the tree against release tags and push
          # ranges, so the full history and tags have to be present.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Gate BEFORE anything else: ci.yml is a separate workflow, so its copy of
      # this check cannot stop a publish that reaches here with CI red, skipped,
      # or never run at all. This one judges the tree against the registry, so it
      # holds for every trigger — branch push, release tag, and manual run alike.
      # `github.event.before` is absent (or all zeroes) for tag and manual runs;
      # the script treats it as an optional fallback and uses the release tags
      # otherwise.
      - name: Validate package versions (pre-publish gate)
        run: node scripts/check-package-version-bumps.mjs --release "$FALLBACK_BASE"
        env:
          FALLBACK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json

      - run: pnpm install --frozen-lockfile

      # Build in dependency order (dsl first); storage/renderer/importer resolve
      # @openmaic/dsl through the workspace link.
      - name: Build @openmaic packages
        run: >-
          pnpm -r
          --filter "@openmaic/dsl"
          --filter "@openmaic/storage"
          --filter "@openmaic/renderer"
          --filter "@openmaic/importer"
          run build

      # Gate BEFORE any publish: a failure here aborts before a single package
      # reaches the registry. npm versions are immutable, so this prevents a
      # partial release (e.g. dsl published, then a sibling's test fails).
      - name: Test & typecheck (pre-publish gate)
        run: |
          pnpm --filter "@openmaic/dsl" --filter "@openmaic/storage" --filter "@openmaic/importer" run test
          pnpm --filter "@openmaic/dsl" --filter "@openmaic/storage" --filter "@openmaic/renderer" run typecheck

      # Always review tarball contents before any publish.
      - name: Inspect tarball contents (dry-run pack)
        run: |
          for pkg in dsl storage renderer importer; do
            echo "::group::@openmaic/$pkg"
            ( cd "packages/@openmaic/$pkg" && pnpm pack --dry-run )
            echo "::endgroup::"
          done

      - name: Smoke-test publishable tarballs
        run: pnpm test:package-tarballs

      # Real publish. pnpm rewrites the workspace:* dep on @openmaic/dsl to the
      # concrete published version and publishes in topological order.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: >-
          pnpm -r
          --filter "@openmaic/dsl"
          --filter "@openmaic/storage"
          --filter "@openmaic/renderer"
          --filter "@openmaic/importer"
          publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Anchor every version this run put on the registry to the commit that
      # produced it. Without these tags the gate above has nothing to compare an
      # already-published version against on a tag or manual run, and a package
      # whose source drifted from its release would publish as a silent no-op.
      #
      # These pushes use the checkout's default GITHUB_TOKEN credentials, and
      # GitHub does not start new workflow runs from GITHUB_TOKEN pushes, so
      # writing an `@openmaic/*@*` tag here does not re-trigger this workflow.
      - name: Tag published versions
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RELEASE_PLAN_PATH, "utf8")).map((entry) => `${entry.package}@${entry.version}`).join("\n")')"
          if [ -z "$tags" ]; then
            echo "No newly published versions to tag."
            exit 0
          fi
          echo "$tags" | while read -r tag; do
            [ -n "$tag" ] || continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists, leaving it alone."
              continue
            fi
            git tag "$tag" "$GIT_COMMIT"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag at $GIT_COMMIT."
          done
